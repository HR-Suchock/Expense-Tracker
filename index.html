
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* --- Base Styles --- */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #f7f9fc;
      color: #222;
      margin: 0;
      padding: 0;
      transition: 0.3s ease;
    }
    body.dark {
      background: #121212;
      color: #eee;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.3s ease;
    }
    body.dark .container {
      background: rgba(30,30,30,0.95);
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 15px;
      word-break: break-word;
    }

    button, input, select {
      font-size: 1rem;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: 0.2s ease;
    }
    button {
      background: #4a6cf7;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover { background: #3e5ce3; }

    #dark-mode-toggle {
      float: right;
      background: #333;
      color: #fff;
      margin-top: -10px;
    }

    /* --- Budget Section --- */
    .budget-section {
      text-align: center;
      margin: 20px 0;
    }
    .budget-section input {
      width: 60%;
      max-width: 250px;
      margin-bottom: 10px;
    }

    /* --- Budget Display --- */
    .budget-display {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      gap: 10px;
      text-align: center;
      margin-bottom: 20px;
    }
    .budget-display p {
      flex: 1 1 150px;
      margin: 5px 0;
    }

    /* --- Expense Form --- */
    #expense-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .c-button {
      background: linear-gradient(90deg, #4a6cf7, #7b61ff);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 10px;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .c-button:hover {
      transform: scale(1.05);
    }

    /* --- Filters --- */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .filters input, .filters select {
      min-width: 120px;
    }

    /* --- Table --- */
    .table-container {
      overflow-x: auto;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 600px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }
    th {
      background: #f0f0f0;
    }
    body.dark th {
      background: #1e1e1e;
    }
    .delete-btn {
      background: #e63946;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .delete-btn:hover { background: #c72535; }

    /* --- Chart --- */
    canvas {
      max-width: 100%;
      height: auto;
      display: block;
      margin: auto;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.2rem; }
      button, input, select {
        font-size: 0.9rem;
      }
      .budget-section input {
        width: 80%;
      }
      #expense-form {
        grid-template-columns: 1fr 1fr;
      }
      .filters {
        flex-direction: column;
        align-items: center;
      }
      #dark-mode-toggle {
        float: none;
        margin-bottom: 10px;
      }
    }
    @media (max-width: 480px) {
      #expense-form {
        grid-template-columns: 1fr;
      }
      .budget-display p {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <!-- Dark Mode Toggle -->
    <button id="dark-mode-toggle">🌙 Dark Mode</button>

    <!-- Budget Input -->
    <div class="budget-section">
      <input type="number" id="budget-input" placeholder="Set Monthly Budget">
      <button id="set-budget-btn">Set Budget</button>
      <p id="budget-alert"></p>
    </div>

    <!-- Budget Display -->
    <div class="budget-display">
      <p>Monthly Budget: <span id="display-budget">0</span> BDT</p>
      <p>Total Expense: <span id="display-expense">0</span> BDT</p>
      <p>Remaining Budget: <span id="display-remaining">0</span> BDT</p>
    </div>

    <!-- Add Expense Form -->
    <form id="expense-form">
      <input type="number" id="amount" placeholder="Amount" required>
      <input type="text" id="category" placeholder="Category" required>
      <input type="date" id="date" required>
      <input type="text" id="note" placeholder="Note">
      <button type="submit" class="c-button">➕ Add Expense</button>
    </form>

    <!-- Filters -->
    <div class="filters">
      <input type="month" id="month-filter">
      <select id="category-filter">
        <option value="">All Categories</option>
      </select>
      <button id="filter-btn">Filter</button>
    </div>

    <!-- Transactions Table -->
    <h2>Transactions</h2>
    <div class="table-container">
      <table id="expense-table">
        <thead>
          <tr>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Note</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
    </div>

    <!-- Pie Chart -->
    <h2>Expense Chart</h2>
    <canvas id="expense-chart" width="400" height="200"></canvas>

    <!-- Export PDF -->
    <button id="export-pdf-btn">📄 Export PDF</button>
  </div>

 <!-- Libraries (Local) -->
<script src="./chart.js"></script>
<script src="./jspdf.umd.min.js"></script>
<script src="script.js"></script>

<!-- Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('✅ Service Worker registered with scope:', reg.scope))
        .catch(err => console.error('❌ Service Worker registration failed:', err));
    });
  }
</script>
</body>
</html>
